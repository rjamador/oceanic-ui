<!doctype html>
<html lang="en">
  <head>

    <!--

      changes, update it here plus public/robots.txt and public/sitemap.xml.
    -->
    <title>oceanic-ui — the Ocean look &amp; feel, for React</title>
    <meta
      name="description"
      content="oceanic-ui is a small, accessible React component library in the spirit of Java Swing's Ocean theme: 26 components, cool near-white gradients, a soft glow instead of gloss, precompiled CSS, tree-shakeable, WCAG AA."

    <link rel="canonical" href="https://oceanic-ui.netlify.app/" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="author" content="Roberto Amador" />
    <meta name="theme-color" content="#eaf6ff" />
    <meta name="color-scheme" content="light" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="oceanic-ui" />
    <meta property="og:title" content="oceanic-ui — the Ocean look & feel, for React" />

      property="og:description"
      content="A small, accessible React component library in the spirit of Java Swing's Ocean theme. 26 components, precompiled CSS, tree-shakeable, WCAG AA."

    <meta property="og:url" content="https://oceanic-ui.netlify.app/" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
